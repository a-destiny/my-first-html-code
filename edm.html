<!DOCTYPE html>
<html>
  <head>
    <title>CSS Practise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="icon.jpg" />
  </head>
  <body>
    <style>
        body{
            color: rgb(55, 53, 53);
        }

        #top h1{
            letter-spacing: -5px;
            color: rgb(174, 32, 32);
        }

        #top span{
            letter-spacing: -1px;
            font-style: italic;
            color: rgb(55, 53, 53);
        }

        #top{
        padding-left: 26px;
        }
        #mid{
            background-color: rgb(206, 206, 171);
            padding: 35px 30px;
            width: 400px;
        }

        #mid h1{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
    <div id="top">
      <h1>EDM <span>designer</span></h1>
    </div>
    <div id="mid">
      <h2>Typography sample</h2>
      <p>In this sample html, I would like to demonstrate hoe text-styles acts
        in Email HTML. This is a paragraph with a table wrapper. Padding values
        moved from P to TD. our freshly included self-hosted custom fonts:
        RALEWAY, PLAYFAIR DISPLAY </p>
      <h1>Heading One</h1>
    </div>
  </body>
</html>
